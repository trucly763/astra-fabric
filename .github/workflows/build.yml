name: Build Astra

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew clean build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: astra-jar
          path: build/libs/astra-*.jar
